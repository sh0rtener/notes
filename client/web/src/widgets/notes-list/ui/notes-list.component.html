<div class="notes-list">
    <div class="notes-list__header">
        <h2>Список заметок</h2>
        <app-primary-button (buttonClick)="createTask()">Создать заметку</app-primary-button>
    </div>
    <div class="notes-list__content">

        @for (note of notes(); track note.id) {
        <app-note-card [note]="note" />
        }
    </div>
</div>
<app-modal title="Создать заметку" [(isActive)]="isCreateTaskModal">
    <app-create-task-form (created)="onNoteCreated($event)"></app-create-task-form>
</app-modal>

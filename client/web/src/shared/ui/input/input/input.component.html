<div class="input">
    @if (label()) {
    <label [for]="id()">
        {{ label() }}
    </label>
    }

    <input [id]="id()" [type]="type()" [placeholder]="placeholder()" [disabled]="disabled()" [value]="value"
        (input)="onInput($event)" (blur)="onTouched()" />
    @if (control()?.invalid && control()?.touched)
    {
        <span class="error">
            {{ errorMessage() }}
        </span>
    }
</div>

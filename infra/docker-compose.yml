services:
  notes-api1:
    image: notes-api1
    hostname: notes-api1
    container_name: notes-api1
    restart: always
    build:
      context: ../
      dockerfile: infra/server/Dockerfile
    environment:
      - ConnectionStrings__sqlite=Data Source=/app/data/tmp.db
    volumes:
      - ./sqlite:/app/data
    ports:
      - 1111:8080


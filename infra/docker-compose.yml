  web-client:
    image: web-client
    hostname: web-client
    container_name: web-client
    restart: always
    build:
      context: ../
      dockerfile: infra/client/Dockerfile
    ports:
      - 4000:4000

  balancer-nginx:
    image: balancer-nginx
    hostname: ngx
    container_name: ngx
    restart: always
    build:
      context: nginx/
      dockerfile: Dockerfile
    ports:
      - 8081:8080